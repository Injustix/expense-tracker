services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      SESSION_COOKIE: expense_tracker_session
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: expense_tracker
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      [ -f .env ] || cp .env.example .env;
      composer install --no-interaction;
      grep -q '^APP_KEY=.' .env || php artisan key:generate;
      php artisan migrate --force;
      apache2-foreground
      "

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: expense_tracker
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

volumes:
  db-data: